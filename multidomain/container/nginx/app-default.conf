# https://github.com/paijp/vps-subdomain-mcp
#
# Default site location, included inside the HTTPS server block of
# conf.d/vps-mcp.conf. Each application owns one file in /etc/nginx/app.d/;
# replace or remove this file when an application takes over "location /".

# ── Default: serve /var/www/html ─────────────────────────────────────────
location / {
    root  /var/www/html;
    index index.html index.htm;
}
