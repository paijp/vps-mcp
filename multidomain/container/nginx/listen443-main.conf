# https://github.com/paijp/vps-subdomain-mcp
#
# Listen directives of the MAIN HTTPS server block (conf.d/vps-mcp.conf) only.
# default_server keeps it the fallback for names no other server block claims,
# whatever order conf.d/ files load in; 127.0.0.1:443 takes direct TLS from
# inside the container (health checks). Every other HTTPS server block
# includes /etc/nginx/listen443.conf instead. vps-mcp-mode.sh rewrites this
# file in forward mode.
listen 443 ssl proxy_protocol default_server;
listen 127.0.0.1:443 ssl;
set_real_ip_from 10.89.0.1;
real_ip_header   proxy_protocol;
