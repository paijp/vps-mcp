# https://github.com/paijp/vps-subdomain-mcp
#
# Certificate for every HTTPS server block (include this file). Self-signed
# until vps-mcp-mode.sh getcert obtains the Let's Encrypt certificate and
# rewrites these two lines.
ssl_certificate     /etc/nginx/ssl/fullchain.pem;
ssl_certificate_key /etc/nginx/ssl/privkey.pem;
