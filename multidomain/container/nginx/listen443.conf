# https://github.com/paijp/vps-subdomain-mcp
#
# Listen directives for EVERY HTTPS server block (include this file; never
# copy its lines). PROXY protocol comes from the SNI passthrough proxy; trust
# its header only from the gateway.
#
# vps-mcp-mode.sh rewrites this file: in forward mode port 443 belongs to the
# stream passthrough to the old server (/etc/nginx/stream.d/), so the HTTPS
# server blocks move to 127.0.0.1:8443, where nothing reaches them.
listen 443 ssl proxy_protocol;
set_real_ip_from 10.89.0.1;
real_ip_header   proxy_protocol;
