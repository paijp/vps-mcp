# https://github.com/paijp/vps-subdomain-mcp
# Load the vps-mcp OCI hooks (staging view, vps-mcp-stgview-*.json) from an
# explicitly configured directory: Podman warns that implicit hook
# directories are deprecated, so a future release may stop reading them.
[engine]
hooks_dir = ["/usr/share/containers/oci/hooks.d"]
