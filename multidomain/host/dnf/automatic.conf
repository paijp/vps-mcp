# https://github.com/paijp/vps-subdomain-mcp

# dnf-automatic configuration for the VPS seminar host.
# Applies ALL available updates automatically (upgrade_type = default), not
# only those tagged as security errata. Security-only misses fixes that are
# not tagged: packages rebuilt for a new minor release (e.g. Rocky 10.2 ->
# 10.3, where a fixed bind/postfix arrived untagged) and third-party repos
# without updateinfo (e.g. NodeSource). The containers already do the same
# via dnf-automatic-install's default settings.
# Host reboots are handled separately by vps-mcp-reboot.timer, so
# dnf-automatic itself never reboots; new kernels take effect at that reboot.

[commands]
upgrade_type = default
random_sleep = 3600
network_online_timeout = 60
download_updates = yes
apply_updates = yes
reboot = never

[emitters]
emit_via = stdio

[base]
debuglevel = 1
