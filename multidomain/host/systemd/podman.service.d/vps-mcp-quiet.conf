# https://github.com/paijp/vps-subdomain-mcp
# list-containers polls the Podman API every few seconds to refresh the
# proxies' routing table; at the packaged --log-level=info the API service
# writes one journal line per request (tens of thousands a day). Warnings and
# errors are still logged.
[Service]
Environment=LOGGING="--log-level=warn"
