# https://github.com/paijp/vps-subdomain-mcp
# list-containers polls the Podman API every few seconds to refresh the
# proxies' routing table; at the packaged --log-level=info the API service
# writes one journal line per request (tens of thousands a day). Warnings and
# errors are still logged.
[Service]
Environment=LOGGING="--log-level=warn"
# list-containers' polling also keeps the service from ever going idle, so it
# never exits on its own and keeps running the binary it started with: after
# a podman upgrade the old API service misreported containers created by the
# new podman (empty IP → the proxies sent their traffic to the apex
# container). Restart it hourly; podman.socket activates it again on the next
# request, and the proxies keep their last routes during the gap.
RuntimeMaxSec=1h
